#
# Publishes a release: Actions -> Release -> Run workflow (on main) with a version like 0.3.0.
# It requires the committed version, builds/signs the appx, then creates a draft
# at that exact commit before publishing. It never creates commits or overwrites release assets.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, MAJOR.MINOR.BUILD.REVISION (e.g. 0.3.6.0)
        required: true
        type: string
      highlights:
        description: Optional text shown above the changelog
        required: false
        type: string
      prerelease:
        description: Mark as a pre-release (not shown as Latest)
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time; a release never cancels another.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.check.outputs.package_version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main' || github.repository != 'wallacemiranda/GrungeBox'
        run: |
          echo "::error::Releases must run from main in wallacemiranda/GrungeBox"
          exit 1

      - uses: actions/checkout@v7

      - run: python3 tools/xbox/tests/release.py

      - name: Check the version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # Without it, tee hides a failed check and the build runs an hour with no version.
          set -o pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 tools/xbox/release.py version "$VERSION" --manifest dist/uwp/AppxManifest.xml \
              --releases "$RUNNER_TEMP/releases.json" --match-manifest \
              --issue-template .github/ISSUE_TEMPLATE/bug_report.yml | tee -a "$GITHUB_OUTPUT"
          tag="$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::The tag $tag already exists"
              exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      package: true
      package_version: ${{ needs.version.outputs.package_version }}
      lto: true
    secrets: inherit

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      HIGHLIGHTS: ${{ inputs.highlights }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      # The commit that was built, with full history and tags for the changelog.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: jadyx-package
          path: out

      # Publish the fork's signed installer and checksums. The upstream updater metadata
      # requires Jadyx's pinned distribution key and points to its upstream release URLs.
      # GrungeBOX releases are installed manually and do not publish upstream update metadata.

      - name: Record release source
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          # The version is already committed and matches the build. Never create bot-authored commits.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Write the release notes
        run: |
          {
              if [ -n "$HIGHLIGHTS" ]; then printf '%s\n\n' "$HIGHLIGHTS"; fi
              python3 tools/xbox/release.py notes --tag "$TAG" --previous "$PREVIOUS" --repo "$GITHUB_REPOSITORY"
              cat <<EOF

          ## Install GrungeBOX

          You need an Xbox Series X|S in Dev Mode. No keys, firmware or games are included: use your
          own dumps.

          1. Download \`GrungeBOX_${PACKAGE_VERSION}_x64.appx\` and \`Microsoft.VCLibs.x64.14.00.appx\`
             from the assets below. The package also includes \`GrungeBOX.cer\` if the console needs
             to trust this fork's signing certificate.
          2. On a PC on the same network, open Device Portal at \`https://<xbox-ip>:11443\` (Dev Home
             shows the address) and accept the browser's certificate warning.
          3. Choose **Add**, pick the GrungeBOX appx, add the VCLibs appx as a dependency if a compatible
             version is not already installed, and install.
          4. In Dev Home, select GrungeBOX → **View details** and set **App type** to **Game**. In App mode
             it runs out of memory.
          5. Start GrungeBOX and send your keys, firmware and games from a PC or phone with the
             **GrungeBOX Portal**: **Settings → File manager → Network connection → Start server**, open
             the address it shows in a browser on the same network and enter the connection code.
          6. Other ways: import keys and firmware from a folder or ZIP on a USB drive in
             **Settings → File manager**, and add games from an external folder or USB drive, or copy
             them to the app's \`LocalState\games\` folder with the Device Portal file explorer.

          A newer version installs over the previous one and keeps your games, saves and settings. Do
          not uninstall to update: uninstalling deletes them.

          ## Reporting bugs

          Open an issue at https://github.com/${GITHUB_REPOSITORY}/issues/new/choose with the **Bug
          Report** form. A good report has:

          - The GrungeBOX version (\`${TAG#v}\`) and whether it is a Series X or S, in Game mode.
          - What you did, what you expected and what happened instead, with the steps to make it
            happen again.
          - The logs from the app's \`LocalState\jadyx\log\` folder (Device Portal → **File
            explorer**): \`jadyx_log.txt\`, \`jadyx_diag.txt\` and, for graphics problems,
            \`jadyx_graphics_bugs.log\`. Grab them right after the problem, before launching another
            game.

          Search the existing issues first. Reports about pirated keys, firmware or games are closed.
          If the bug also happens in the desktop builds of Eden, report it to Eden instead.

          Questions, install help and compatibility reports: join the
          [Discord](https://discord.gg/3BhyyXGxpd).
          EOF
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish
        run: |
          version="${TAG#v}"
          title="GrungeBOX $version"
          if [ "${version%%.*}" = "0" ]; then title="$title Beta"; fi
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          draft_flags=()
          if [ "$PRERELEASE" = "true" ]; then draft_flags=(--prerelease); fi
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$title" --notes-file "$RUNNER_TEMP/notes.md" \
              "${draft_flags[@]}"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/release-verify"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "GrungeBOX_${PACKAGE_VERSION}_x64.appx" -p SHA256SUMS.txt --dir "$RUNNER_TEMP/release-verify"
          for file in "GrungeBOX_${PACKAGE_VERSION}_x64.appx" SHA256SUMS.txt; do
              cmp "out/$file" "$RUNNER_TEMP/release-verify/$file"
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
          echo "TITLE=$title" >> "$GITHUB_ENV"
